# Mazyoud Collection Vote — single container (API + built frontend).
#
# This service joins the external "caddy" network so the Caddy reverse proxy can
# reach it by name (see Caddyfile.snippet: `reverse_proxy mazyoud-vote:8080`).
# For standalone testing without Caddy, uncomment the `ports` block below.
name: mazyoud-vote

services:
  mazyoud-vote:
    build:
      context: .
      dockerfile: Dockerfile
    image: mazyoud-vote:latest
    container_name: mazyoud-vote
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=8080
      - NODE_ENV=production
      - DATA_DIR=/app/server/data
    expose:
      - "8080"
    # ports:
    #   - "8080:8080"   # uncomment for direct/local access without Caddy
    volumes:
      # Persists the uploaded workbook, votes (votes.jsonl) and voters across
      # restarts/redeploys. Required for the default xlsx backend.
      - mazyoud-data:/app/server/data
    networks:
      - caddy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  caddy:
    external: true

volumes:
  mazyoud-data:
