[project]
name = "photo-pipeline"
version = "0.1.0"
description = "Mazyoud product photo pipeline — CR3 to catalogue-ready images"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy[asyncio]>=2.0.35",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyvips>=2.2",
    "rawpy>=0.21",
    "numpy>=1.26",
    "httpx[http2]>=0.27",
    "zxing-cpp>=2.2",
    "onnxruntime>=1.29.0",
    "psutil>=7.2.2",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "ruff>=0.6",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "onnx>=1.22.0",
    "types-psutil>=7.2.2.20260518",
]

[project.scripts]
photo-pipeline = "photo_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/photo_pipeline"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["photo_pipeline"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pyvips", "pyvips.*", "rawpy", "rawpy.*", "zxingcpp", "onnx", "onnx.*", "onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true
implicit_reexport = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "A", "C4", "RET", "SIM", "PTH",
    "RUF", "ASYNC", "S", "PL",
]
ignore = [
    "PLR0913",  # settings/compositor functions legitimately take many params
    "PLR0917",  # same — keyword-rich pipeline entry points
    "S101",     # asserts are used for invariants and in tests
    "N818",     # exception names are mandated by CLAUDE.md (RateLimited, ...)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "PLR2004", "PLC0415"]
"migrations/*" = ["I001"]
# cli and standin import heavy deps lazily so `--help` and non-bench paths stay fast.
"src/photo_pipeline/cli.py" = ["PLC0415"]
"src/photo_pipeline/segment/standin.py" = ["PLC0415"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
